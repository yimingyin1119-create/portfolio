<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>痛点认领 Demo</title>
<meta name="description" content="概念 Demo：在 AI 搜索的回答里，品牌买不到答案，只能认领用户的真实痛点、提供服务，并凭演出票根到场核销证明效果。">
<meta property="og:title" content="痛点认领 Demo · 尹伊茗">
<meta property="og:description" content="在 AI 回答里，品牌买不到答案，只能认领用户的真实痛点。数据均为模拟，品牌均为虚构。">
<style>
/* A product mock, so it commits to one light look: indigo marks what the AI wrote, warm amber marks
   anything a brand paid for, green-teal marks the organiser, and plain ink carries the actions. */
:root{
  color-scheme:light;
  --ai:#4F46E5; --ai-l:#EEF0FF; --ai-d:#3730A3; --ai-line:#C7CBF7; --act:#1F2433; --danger:#DC2626;
  --ad:#B45309; --ad-bg:#FFF9EF; --ad-line:#F1DFBF; --ad-tag:#FBEBCF; --org:#0F766E; --org-l:#E3F3F0; --org-line:#9ED2C8;
  --green:#16A34A; --green-l:#E7F6EC; --ink:#222; --sub:#555; --muted:#8A8A8A; --faint:#B0B3B8;
  --line:#EBEDF0; --hair:#F2F3F5; --card:#F7F8FA; --stage:#EDEEF0; --white:#FFFFFF; --frame:#1F2023;
  --flash:#FFE58F; --warn-bg:#FFF7E6; --warn:#B45309;
  --f:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--ink);font:14px/1.6 var(--f);-webkit-font-smoothing:antialiased;overflow:hidden;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}
a{color:inherit}
#app{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(24px);opacity:.4}}
@keyframes slide{from{transform:translateX(30px);opacity:.4}}
@keyframes flash{0%,30%{opacity:.75}100%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}

/* demo bar */
.dbar{flex:none;height:56px;background:var(--white);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 20px}
.bl{display:flex;align-items:center;gap:10px;min-width:0}
.back{flex:none;color:var(--muted);text-decoration:none;font-size:13px;white-space:nowrap;padding-right:12px;border-right:1px solid var(--line)}
.back:hover{color:var(--ink)}
.tag{flex:none;font-size:12px;color:var(--ai);border:1px solid var(--ai);border-radius:4px;padding:0 6px;line-height:20px;white-space:nowrap}
.ttl{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bsub{font-size:12px;color:var(--muted);white-space:nowrap}
.br{display:flex;align-items:center;gap:10px;flex:none}
.seg{display:inline-flex;background:var(--hair);border-radius:8px;padding:2px}
.seg button{padding:5px 12px;border-radius:6px;font-size:13px;color:var(--sub);white-space:nowrap;transition:background-color .15s}
.seg button[aria-pressed="true"]{background:var(--white);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg .s{display:none}
.tl{font-size:13px;color:var(--sub);padding:5px 6px;white-space:nowrap}
.tl:hover{color:var(--ink)}
.burger{display:none}
@media (max-width:1199px){.ttl{display:none}}
@media (max-width:1060px){.bsub{display:none}.seg button{padding:5px 9px;font-size:12px}}

/* stage and frames */
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.phone{position:relative;width:390px;max-width:calc(100% - 24px);height:min(844px,calc(100% - 24px));border-radius:40px;border:6px solid var(--frame);background:var(--white);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(0,0,0,.12)}
#phScreen{flex:1;min-height:0;display:flex;flex-direction:column}
.desk{position:relative;width:min(1000px,calc(100% - 40px));height:calc(100% - 24px);border-radius:12px;background:var(--white);overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.08);display:flex;flex-direction:column}
#deskIn{flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.toast{position:absolute;left:50%;bottom:110px;transform:translate(-50%,8px);background:rgba(28,28,30,.9);color:var(--white);font-size:13px;line-height:1.5;padding:8px 14px;border-radius:8px;width:max-content;max-width:80%;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:9}
.toast.on{opacity:1;transform:translate(-50%,0)}
.flash{position:relative}
.flash::after{content:"";position:absolute;inset:-6px;border-radius:12px;background:var(--flash);pointer-events:none;mix-blend-mode:multiply;opacity:0;animation:flash 2s ease-out}

/* phone: status and top bars */
.sbar{flex:none;height:40px;display:flex;justify-content:space-between;align-items:center;padding:6px 28px 0;font-size:14px;font-weight:600}
.sbi{display:flex;gap:6px;align-items:center}
.tb{flex:none;height:48px;display:grid;grid-template-columns:88px minmax(0,1fr) 88px;align-items:center;padding:0 6px;border-bottom:1px solid var(--hair)}
.tb .tt{display:flex;align-items:center;justify-content:center;gap:6px;font-size:16px;font-weight:600}
.tb .rt{display:flex;justify-content:flex-end}
.ib{position:relative;width:40px;height:40px;display:grid;place-items:center;font-size:22px;color:#333;line-height:1}
.ib.more{font-size:15px;letter-spacing:1px}
.spark{display:inline-grid;color:var(--ai)}
.badge{position:absolute;top:4px;right:2px;min-width:16px;height:16px;border-radius:8px;background:var(--ai);color:var(--white);font-size:10px;font-weight:700;line-height:16px;padding:0 4px;text-align:center}
#phScroll{padding:14px 14px 22px;background:var(--white)}

/* phone: answer */
.q{display:flex;justify-content:flex-end;margin-bottom:12px}
.q span{background:var(--ai-l);color:var(--ai-d);border-radius:16px 16px 4px 16px;padding:9px 14px;font-size:15px;max-width:80%}
.ans{font-size:15px;line-height:1.7}
.refs{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);background:var(--card);border-radius:999px;padding:4px 10px 4px 12px}
.refs.static{cursor:default}
.avs{display:inline-flex;padding-left:6px}
.avs i{width:18px;height:18px;border-radius:50%;border:2px solid var(--white);margin-left:-6px;background:#FFD6D6}
.avs i:nth-child(2){background:#D6ECFF}
.avs i:nth-child(3){background:#DFF5E1}
.chev{color:var(--faint)}
.srcn{font-size:12px;color:var(--muted);margin:6px 0 0}
.intro{margin:10px 0 2px}
.as h3,.ans h3{font-size:16px;line-height:1.5;margin:18px 0 6px}
.para{margin:0 0 12px}
.para > p{margin:0}
mark{background:var(--ai-l);color:var(--ink);font-weight:700;padding:1px 5px;border-radius:4px;margin-right:6px}
.pm{font-size:12px;color:var(--muted);margin:6px 0 0!important}
.offi{border-left:2px solid var(--org-line);padding:4px 10px;margin:8px 0 0}
.offi p{margin:0}
.offi .oh{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.offi .oh b{font-size:12px;color:var(--org)}
.offi .oh span{font-size:12px;color:var(--muted)}
.offi .ot{font-size:13px;color:var(--sub);line-height:1.6}
.small{font-size:12px;color:var(--muted);line-height:1.6;margin:8px 0 0}
.acts{display:flex;gap:14px;margin:12px 0 0;color:var(--muted)}
.acts button{width:28px;height:28px;display:grid;place-items:center;border-radius:6px}
.acts button:hover{background:var(--hair)}
.fups{display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin-top:14px}
.fu{background:var(--hair);border-radius:999px;padding:6px 12px;font-size:13px;color:#333;text-align:left}

/* scene 2: ranking */
.rank{margin:12px 0 0;display:flex;flex-direction:column;gap:10px}
.rk{display:grid;grid-template-columns:20px 36px minmax(0,1fr) 34px;gap:4px 8px;align-items:center}
.rk .rn{font-size:12px;font-weight:700;color:var(--muted)}
.rk b{font-size:14px}
.rbar{height:6px;border-radius:3px;background:var(--hair);overflow:hidden}
.rbar i{display:block;height:100%;background:var(--ai);border-radius:3px}
.rk .rs{font-size:13px;font-weight:600;text-align:right}
.rk p{grid-column:2/-1;margin:0;font-size:13px;color:var(--sub);line-height:1.5}
.mn{font-size:12px;color:var(--muted)}

/* the one brand card */
.bcard{position:relative;background:var(--ad-bg);border:1px solid var(--ad-line);border-radius:12px;padding:12px;margin-top:8px;font-size:13px;line-height:1.55}
.bh{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.adl{font-size:11px;background:var(--ad-tag);color:var(--ad);border-radius:3px;padding:0 4px;line-height:17px}
.av{width:20px;height:20px;border-radius:50%;background:#2B2D33;color:var(--white);font-size:11px;display:grid;place-items:center;flex:none;line-height:1}
.bn{font-size:14px}
.bc{font-size:12px;color:var(--muted)}
.newl{font-size:11px;color:var(--ad);border:1px solid var(--ad);border-radius:3px;padding:0 4px;line-height:16px}
.btags{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.btags span{font-size:11px;color:#666;background:#ECEEF1;border-radius:3px;padding:0 5px}
.sol{margin:8px 0 0;color:#333}
.off{margin:4px 0 0;color:var(--ad);font-weight:700;font-size:14px}
.whyt{margin:8px 0 0;padding:8px 10px;background:var(--white);border:1px solid var(--ad-line);border-radius:8px;color:var(--sub);font-size:12px;line-height:1.6}
.bf{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;margin-top:10px}
.lk{font-size:12px;color:var(--muted);white-space:nowrap}
.lk:disabled{color:var(--faint)}
.pbtn{margin-left:auto;height:32px;padding:0 14px;border-radius:999px;background:var(--act);color:var(--white);font-size:13px;font-weight:600;white-space:nowrap;flex:none;transition:transform .1s}
.pbtn:active,.redbtn:active,.inkbtn:active{transform:scale(.97)}
.pbtn.got{background:var(--white);border:1px solid #C9CDD4;color:var(--sub);font-weight:500}
.pv{pointer-events:none}

/* phone: bottom input */
.ibar{flex:none;padding:8px 12px 10px;border-top:1px solid var(--hair);background:var(--white)}
.fake{display:block;width:100%;text-align:left;height:40px;border-radius:20px;background:var(--hair);padding:0 16px;color:#999;font-size:14px}
.ibar p{margin:5px 0 0;text-align:center;font-size:11px;color:var(--faint)}

/* phone: sheets */
.layer{position:absolute;inset:0;z-index:5}
.mask{position:absolute;inset:0;background:rgba(0,0,0,.35);animation:fade .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:80%;overflow-y:auto;background:var(--white);border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
.sheet h4{margin:0 0 12px;font-size:16px;text-align:center}
.x{position:absolute;right:6px;top:6px;width:36px;height:36px;font-size:22px;line-height:1;color:#999;border-radius:8px}
.cites{list-style:none;margin:0;padding:0}
.cites li{padding:10px 0;border-bottom:1px solid var(--hair)}
.cites p{margin:0;font-size:14px;line-height:1.5}
.cites .ctag{display:inline-block;margin-left:6px;font-size:11px;color:var(--sub);background:#ECEEF1;border-radius:3px;padding:0 5px;vertical-align:1px;font-weight:400}
.cites span.by{font-size:12px;color:var(--muted)}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:100%;height:140px;border:1.5px dashed #C9CDD4;border-radius:12px;color:var(--muted);font-size:13px}
.drop .plus{font-size:28px;line-height:1;color:var(--faint)}
.spinner{width:26px;height:26px;border-radius:50%;border:3px solid var(--ai-l);border-top-color:var(--ai);animation:spin .8s linear infinite}
.tk{border-radius:12px;background:linear-gradient(135deg,#1E2A3A,#33465E);color:var(--white);padding:14px 16px;position:relative}
.tk b{font-size:16px;display:block}
.tk p{margin:2px 0 0;font-size:13px;opacity:.85}
.okline{margin:10px 0 0;color:var(--green);font-weight:600;font-size:14px}
.redbtn{height:40px;padding:0 20px;border-radius:999px;background:var(--act);color:var(--white);font-weight:600;font-size:14px;transition:transform .1s}
.redbtn.wide{display:block;width:100%;height:44px;margin-top:12px}
.tiny{margin:10px 0 0;text-align:center;font-size:11px;color:var(--faint)}

/* phone: benefits and note */
.tkinfo{font-size:12px;color:var(--sub);background:var(--card);border-radius:8px;padding:8px 10px;margin-bottom:12px}
.bene{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.bene .st{margin-left:auto;font-size:12px;color:var(--muted)}
.bene .st.ok{color:var(--green);font-weight:600}
.bene dl{margin:10px 0 0;display:grid;gap:4px;font-size:13px}
.bene dl div{display:grid;grid-template-columns:3em minmax(0,1fr);gap:8px}
.bene dt{color:var(--muted)}
.bene dd{margin:0}
.code{display:flex;align-items:baseline;justify-content:space-between;margin-top:12px;padding:12px 14px;background:var(--card);border-radius:10px}
.code span{font-size:12px;color:var(--muted)}
.code b{font-size:24px;letter-spacing:3px}
.bene .redbtn{margin-top:12px;width:100%}
.bene .doneb{margin-top:12px;width:100%;height:40px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-size:14px}
.post{display:flex;width:100%;align-items:center;justify-content:space-between;padding:14px;border-radius:12px;background:var(--ai-l);color:var(--ai-d);font-size:15px;text-align:left}
.empty{text-align:center;color:var(--muted);padding:60px 0}
.empty .emi{font-size:36px}
.addimg{margin-top:10px;font-size:13px;color:var(--sub);border:1px dashed #C9CDD4;border-radius:8px;padding:5px 12px}
.ntt,.ntb{display:block;width:100%;border:0;border-bottom:1px solid var(--hair);font:inherit;color:var(--ink);padding:12px 0;background:none;outline:none}
.ntt{font-size:17px;font-weight:600}
.ntb{font-size:15px;line-height:1.7;resize:none}
.ntags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ntags span{font-size:12px;border-radius:4px;padding:2px 8px;background:var(--ai-l);color:var(--ai-d)}
.ntags .gray{background:#ECEEF1;color:var(--sub)}
.hint{margin:8px 0 0;font-size:12px;color:var(--sub);background:var(--card);border-radius:6px;padding:6px 10px}

/* brand back office */
.dtop{flex:none;height:52px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 20px;border-bottom:1px solid var(--line)}
.dtop b{font-size:15px;white-space:nowrap}
.dlabel{font-size:12px;color:var(--sub);background:var(--hair);border-radius:999px;padding:2px 10px;white-space:nowrap}
.dt-short,.dl-short{display:none}
.dbody{flex:1;min-height:0;display:grid;grid-template-columns:150px minmax(0,1fr)}
.dnav{border-right:1px solid var(--line);padding:12px 8px;display:flex;flex-direction:column;gap:2px;background:#FAFBFC}
.dnav button{text-align:left;padding:9px 12px;border-radius:8px;font-size:14px;color:var(--sub);white-space:nowrap}
.dnav button:hover{background:var(--hair)}
.dnav button[aria-current="true"]{background:var(--white);color:var(--ink);font-weight:600;box-shadow:inset 3px 0 0 var(--ink),0 1px 2px rgba(0,0,0,.05)}
#dkScroll{padding:20px 24px 32px;font-size:14px}
.dh{margin:0;font-size:18px;line-height:1.4}
.muted{color:var(--muted)}
.pmn{background:var(--card);border-radius:8px;padding:10px 12px;font-size:12.5px;color:var(--sub);margin-bottom:14px;line-height:1.7}
.pmn p{margin:0}
.pmn .g{color:var(--green);font-weight:600}
.twrap{overflow-x:auto}
.ptab{width:100%;border-collapse:collapse;font-size:13px}
.ptab th{font-weight:500;color:var(--muted);text-align:left;font-size:12px;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.ptab td{padding:10px 8px;border-bottom:1px solid var(--hair);vertical-align:middle}
.ptab td:nth-child(-n+6){white-space:nowrap}
.prow{cursor:pointer}
.prow:hover td{background:#FAFBFC}
.prow .car{display:inline-block;width:12px;color:var(--faint);transition:transform .15s}
.prow[aria-expanded="true"] .car{transform:rotate(90deg)}
.pname{font-weight:600;white-space:nowrap}
.share{display:flex;align-items:center;gap:6px;white-space:nowrap}
.sbx{width:56px;height:4px;border-radius:2px;background:#EEF0F3;overflow:hidden;flex:none}
.sbx i{display:block;height:100%;background:var(--ai)}
.low{color:var(--danger);font-style:normal;font-size:11px}
.tr-up{color:var(--danger)}
.tr-down{color:var(--green)}
.ty{font-size:12px;border-radius:4px;padding:1px 6px;background:#EEF0F3;color:var(--sub);white-space:nowrap}
.ty.supply{background:#FFF1E6;color:#B4541A}
.ty.discount{background:var(--ai-l);color:var(--ai-d)}
.ty.venue{background:var(--org-l);color:var(--org)}
.ty.sponsor{background:#F3EDFF;color:#6B3FD1}
.stx{font-size:12px;color:var(--sub)}
.redsm{height:28px;padding:0 12px;border-radius:6px;background:var(--act);color:var(--white);font-size:12px;font-weight:600;white-space:nowrap;margin-right:6px}
.match{font-size:12px;color:var(--green);background:var(--green-l);border-radius:4px;padding:1px 6px;white-space:nowrap}
.act{display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.wl td,.vr td{background:#FCFCFD;font-size:12px;color:var(--sub);padding-top:6px}
.lk2{color:var(--ai);font-size:12px;margin-left:6px}
.ruled{margin:6px 0 0;padding:8px 10px;background:var(--card);border-radius:6px;font-size:12px;color:var(--sub)}
.vt{margin:0 0 4px;font-size:12px;color:var(--muted)}
.vlist{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.vlist li{font-size:12px;background:var(--white);border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:#333}
.pcards{display:none;flex-direction:column;gap:10px}
.pcard{border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer}
.pcard .r1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pcard .r1 b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pcard .r2{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px;font-size:12px}
.pcard .r3{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.pcard .xtra{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:12px;color:var(--sub)}

.ch{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;margin-top:16px;align-items:start}
.cform{display:flex;flex-direction:column;gap:12px;margin:0}
.cform label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--sub)}
.cform input,.cform textarea,.cform select{font:inherit;font-size:14px;color:var(--ink);border:1px solid #DCDFE4;border-radius:8px;padding:8px 10px;background:var(--white);width:100%}
.cform textarea{resize:vertical;line-height:1.5}
.cform input:focus,.cform textarea:focus,.cform select:focus{outline:2px solid var(--ai-line);border-color:var(--ai)}
.cform :disabled{background:var(--card);color:var(--muted)}
.hint2{margin:0;font-size:12px;color:var(--warn);background:var(--warn-bg);border-radius:6px;padding:6px 10px}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend{font-size:13px;color:var(--sub);padding:0;margin-bottom:4px}
.rds{display:flex;gap:16px;flex-wrap:wrap}
.cform .rd{flex-direction:row;align-items:center;gap:6px;color:var(--ink);font-size:14px}
.cform .rd input{width:auto;accent-color:var(--ink)}
.cities{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cities span{font-size:12px;background:var(--hair);border-radius:4px;padding:1px 8px}

.review li.ok .ck{background:var(--green);border-color:var(--green);color:var(--white)}
.review li.run .ck{border-color:var(--ai);border-top-color:transparent;animation:spin .8s linear infinite}
.passed{color:var(--green);font-weight:700;margin:10px 0 0}
.live{font-size:12px;color:var(--white);background:var(--green);border-radius:4px;padding:1px 6px}
.rules{margin-top:28px;border-top:1px solid var(--line);padding-top:16px}
.rules h4{margin:0 0 4px;font-size:15px}
.rgt{font-size:12px;color:var(--muted);margin:14px 0 2px}
.rr{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--hair);font-size:14px;text-align:left}
.rr i{font-style:normal;color:#999;transition:transform .2s}
.rr[aria-expanded="true"] i{transform:rotate(180deg)}
.rdt{margin:6px 0 4px;padding:8px 10px;background:var(--card);border-radius:6px;font-size:13px;color:var(--sub);line-height:1.6}

.funnel{margin-top:6px}
.fr{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;align-items:start;padding:10px 0;border-bottom:1px solid var(--hair)}

.fm p{margin:0;font-size:13px}
.fm p b{margin-right:6px}
.fm p span{color:var(--muted)}
.fb{display:flex;align-items:center;gap:10px;margin-top:6px}
.fbt{flex:1;min-width:0}
.fbt i{display:block;height:12px;border-radius:3px;background:var(--ai);min-width:4px}
.fb b{font-size:14px;white-space:nowrap}
.rt2{font-size:12px;color:var(--sub);margin-top:4px!important}

.incg{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:14px;align-items:center}
.incg b{font-size:26px;display:block;line-height:1.2}

.incg .inc-a b{color:var(--ai-d)}
.df{font-weight:700;font-size:15px;text-align:center;background:var(--ai-l);color:var(--ai-d);border-radius:8px;padding:8px 12px}
.mv{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px;font-size:14px}
.pos{margin:16px 0 0;font-size:14px}

.nt0 p{margin:4px 0 0}

.guide{flex:none;background:var(--white);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.04);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px))}

.g1{display:flex;align-items:center;gap:10px;min-width:0}

.gsteps .done .gn{background:var(--ai)}
.gsteps b{font-size:14px}
.gsteps p{margin:2px 0 4px;font-size:12px;color:var(--muted);line-height:1.5}
.lk3{font-size:13px;color:var(--ai);font-weight:600}
.gmore{margin:8px 0 0;font-size:12px;color:var(--muted)}
.gsrc{margin:2px 0 0;font-size:11px;color:var(--faint)}

/* mobile drawer */
.drawer{position:fixed;inset:0;z-index:40}
.dmask{position:absolute;inset:0;background:rgba(0,0,0,.35);animation:fade .2s}
.dpanel{position:absolute;top:0;right:0;bottom:0;width:min(300px,86vw);background:var(--white);padding:calc(18px + env(safe-area-inset-top,0px)) 18px 20px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;animation:slide .22s ease-out;overflow-y:auto}

  .incg{grid-template-columns:minmax(0,1fr)}
  .df{order:3}
}

/* ---------- the brand card: one component for the answer, the product answer and the back-office preview ---------- */
function cardHTML(c, o = {}){
  const k = c.key, pv = !!o.preview, prod = k.startsWith("p_");
  const act = a => pv ? ` tabindex="-1"` : ` data-action="${a}" data-k="${esc(k)}"`;
  const isNew = c.isNew && !pv && !S.seen.includes(k);
  const got = !prod && S.benefits.some(b => b.key === k);
  const open = !pv && U.why.has(k), fb = S.feedback.includes(k);
  const main = prod ? `<button type="button" class="pbtn"${act("product-go")}>${esc(c.button)}</button>`
    : got ? `<button type="button" class="pbtn got"${act("to-benefits")}>已领取 · 查看核销码</button>`
    : `<button type="button" class="pbtn"${act("take")}>持票领取</button>`;
  return `<div class="bcard${pv ? " pv" : ""}"${pv ? "" : ` data-card="${esc(k)}"`}>
    <div class="bh"><span class="adl">${esc(D.meta.adLabel)}</span><span class="av" aria-hidden="true">${esc(String(c.brand || "?").slice(0, 1))}</span><b class="bn">${esc(c.brand)}</b>${isNew ? `<span class="newl">新上线</span>` : ""}${c.category ? `<span class="bc">${esc(c.category)}</span>` : ""}</div>
    ${prod ? `<div class="btags"><span>${esc(c.type)}</span><span>${esc(c.fulfil)}</span></div>` : ""}
    ${c.solution ? `<p class="sol">${esc(c.solution)}</p>` : ""}
    ${c.offer ? `<p class="off">${esc(c.offer)}</p>` : ""}
    ${open ? `<p class="whyt">${esc(whyText(c))}</p>` : ""}
    <div class="bf"><button type="button" class="lk"${act("why")} aria-expanded="${open}">为什么看到 ${open ? "⌃" : "›"}</button><button type="button" class="lk"${fb ? " disabled" : act("feedback")}>${fb ? "已反馈" : esc(D.feedback.button)}</button>${main}</div>
  </div>`;
}

  return `<h3 class="dh">${esc(C.title)}</h3><p class="small" style="margin:4px 0 12px">${esc(C.subtitle)}</p>
    <div class="funnel">${fun}</div>
    <div class="box"><h4>${esc(I.title)}</h4><div class="incg"><div class="inc-a"><b>${esc(I.claimed)}</b><p>${esc(I.claimedLabel)}</p></div><div class="df">${esc(I.diff)}</div><div class="inc-b"><b>${esc(I.unclaimed)}</b><p>${esc(I.unclaimedLabel)}</p></div></div>
      <p class="small">${esc(I.note)}</p><p class="small">${esc(C.kpiNote)}</p></div>
    <div class="box"><h4>${esc(M.title)}</h4><ul class="mv">${M.items.map(t => `<li>${esc(t)}</li>`).join("")}</ul></div>
    <p class="pos">正面评价占比 <b>${esc(C.positiveRate)}</b></p>
    <h4 style="margin:18px 0 0;font-size:15px">演后分享</h4>
    <div class="nts">${C.notes.map(n => `<div class="nt0"><div class="who"><b>${esc(n.author)}</b><span class="bdg">已到场</span>${n.mentionsBrand ? `<span class="bdg gray">领取过权益</span>` : ""}</div><p>${esc(n.text)}</p></div>`).join("")}</div>
    <p class="small">${esc(C.citedNote)}</p><p class="small">${esc(C.disclaimer)}</p>`;
}
function desk(){
  return `<div class="dtop"><b class="dt-full">${esc(D.backend.title)}</b><b class="dt-short">品牌后台</b><span class="dlabel dl-full">${esc(D.backend.brandLabel)}</span><span class="dlabel dl-short">${esc(BA.name)} · 演示账号</span></div>
    <div class="dbody"><nav class="dnav" aria-label="品牌后台">${D.backend.tabs.map((t, i) => `<button type="button" data-action="tab" data-i="${i}" aria-current="${S.brandTab === i}">${esc(t)}</button>`).join("")}</nav>
    <div class="scroll pg" id="dkScroll">${[painMap, claimPage, casePage][S.brandTab]()}</div></div>`;
}

/* ---------- demo chrome: bar, guide, drawer ---------- */
function barHTML(){
  const B = D.demoBar;
  const views = B.views.map(v => `<button type="button" data-action="view" data-v="${v.id}" aria-pressed="${S.view === v.id}"><span class="l">${esc(v.label)}</span><span class="s">${esc(v.short)}</span></button>`).join("");
  const scenes = S.view === "user" ? `<div class="seg scn" role="group" aria-label="场景">${D.meta.scenes.map(s => `<button type="button" data-action="scene" data-v="${s.id}" aria-pressed="${S.scene === s.id}">${esc(s.label)}</button>`).join("")}</div>` : "";
  return `<div class="bl"><a class="back" href="index.html#demo">‹ 作品集</a><span class="tag">${esc(B.tag)}</span><b class="ttl">${esc(B.title)}</b><span class="bsub">${esc(B.subtitle)}</span></div>
    <div class="br"><div class="seg" role="group" aria-label="视角">${views}</div>${scenes}<button type="button" class="tl" data-action="guide-open">${esc(B.guideButton)}</button><button type="button" class="tl" data-action="reset">${esc(B.resetButton)}</button><button type="button" class="burger" data-action="drawer" aria-label="菜单">☰</button></div>`;
}
function guideHTML(){
  const G = D.guide;
  return `<div class="gin"><div class="g1"><b>${esc(G.title)}</b><span>${esc(D.demoBar.title)}</span><button type="button" class="gx" data-action="guide-close" aria-label="关闭导览">${esc(G.closeLabel)}</button></div>
    <ol class="gsteps">${G.steps.map((s, i) => { const done = S.guideDone.includes(i); return `<li class="${done ? "done" : ""}"><span class="gn" aria-hidden="true">${done ? "✓" : i + 1}</span><div><b>${esc(s.title)}</b><p>${esc(s.desc)}</p><button type="button" class="lk3" data-action="go" data-i="${i}">去看看 →</button></div></li>`; }).join("")}</ol>
    <p class="gmore">${esc(G.tryMore)}</p><p class="gsrc">AI 产品挑战作品 · 本页按原设计说明和数据重建，方便直接打开。</p></div>`;
}
function drawerHTML(){
  const B = D.demoBar;
  return `<div class="dmask" data-action="drawer-close"></div><aside class="dpanel" aria-label="菜单"><button type="button" class="x" data-action="drawer-close" aria-label="关闭">×</button>
    <span class="tag">${esc(B.tag)}</span><p><b>${esc(B.title)}</b></p><p class="small" style="margin:0">${esc(B.subtitle)}</p>
    ${S.view === "user" ? `<p class="dl">场景</p><div class="seg">${D.meta.scenes.map(s => `<button type="button" data-action="scene" data-v="${s.id}" aria-pressed="${S.scene === s.id}">${esc(s.label)}</button>`).join("")}</div>` : ""}
    <p class="dl">演示</p><button type="button" class="dbtn" data-action="guide-open">${esc(B.guideButton)}</button><button type="button" class="dbtn" data-action="reset">${esc(B.resetButton)}</button>
    <a class="dbtn" href="index.html#demo">← 返回作品集</a></aside>`;
}

let lastKey = "";
function render(){
  if ($("#ntT")) noteCheck();
  $("#bar").innerHTML = barHTML();
  const user = S.view === "user", key = user ? `u|${S.scene}|${S.page}` : `b|${S.brandTab}`;
  const old = $(user ? "#phScroll" : "#dkScroll"), keep = key === lastKey && old ? old.scrollTop : 0;
  $("#phone").hidden = !user; $("#desk").hidden = user;
  if (user){ $("#phScreen").innerHTML = phoneScreen(); renderLayer(); } else $("#deskIn").innerHTML = desk();
  const sc = $(user ? "#phScroll" : "#dkScroll");
  if (sc){ sc.scrollTop = keep; if (key === lastKey) sc.classList.remove("pg"); }
  lastKey = key;
  const g = $("#guide"); g.hidden = S.guideClosed; g.innerHTML = S.guideClosed ? "" : guideHTML();
  renderDrawer();
  if (user && S.page === "note") noteCheck();
}
function renderDrawer(){ const d = $("#drawer"); d.hidden = !U.drawer; d.innerHTML = U.drawer ? drawerHTML() : ""; }

let toastT = 0;
function toast(msg){
  const t = $(S.view === "user" ? "#phToast" : "#dkToast");
  $("#phToast").classList.remove("on"); $("#dkToast").classList.remove("on");
  t.textContent = msg; void t.offsetWidth; t.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2400);
}
function focusEl(sel){
  requestAnimationFrame(() => {
    const sc = $("#phScroll"), el = sc && sc.querySelector(sel); if (!el) return;
    const top = el.getBoundingClientRect().top - sc.getBoundingClientRect().top + sc.scrollTop - 72;
    sc.scrollTo({top:Math.max(0, top), behavior:reduce ? "auto" : "smooth"});
    el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
    setTimeout(() => el.classList.remove("flash"), 2100);
  });
}
function grant(k){
  if (!k || S.benefits.some(b => b.key === k)) return;
  const c = cardByKey(k); if (!c) return;
  S.benefits.push({key:k, brand:c.brand, solution:c.solution, offer:c.offer, location:c.location, hours:c.hours, code:String(100000 + Math.floor(Math.random() * 900000)), redeemed:false});
}
function toUser(scene){ S.view = "user"; S.scene = scene; S.page = "answer"; U.sheet = null; }
function guideGo(i){
  const go = D.guide.steps[i].go;
  if (mq.matches) S.guideClosed = true;
  if (go === "brand-claim-luggage"){ S.view = "brand"; S.brandTab = 1; addOnce(S.guideDone, i); save(); render(); return; }
  if (go === "scene2"){ toUser("scene2"); addOnce(S.guideDone, i); save(); render(); focusEl("#rank"); return; }
  toUser("scene1");
  if (go === "scene1-ad"){ addOnce(S.guideDone, i); save(); render(); focusEl(".bcard"); return; }
  const ok = isClaimed(BA.defaultClaim.painId);
  if (ok) addOnce(S.guideDone, i);
  save(); render(); focusEl("#sec-s5");
  if (!ok) toast(D.guide.needClaimToast);
}

const ACT = {
  view(el){ S.view = el.dataset.v; U.drawer = false; save(); render(); },
  scene(el){ toUser(el.dataset.v); U.drawer = false; save(); render(); },
  "guide-open"(){ S.guideClosed = false; U.drawer = false; save(); render(); },
  "guide-close"(){ S.guideClosed = true; save(); render(); },
  reset(){ try { localStorage.removeItem(KEY); } catch {} location.reload(); },
  drawer(){ U.drawer = true; renderDrawer(); },
  "drawer-close"(){ U.drawer = false; renderDrawer(); },
  go(el){ guideGo(Number(el.dataset.i)); },
  toast(){ toast(D.chat.actionToast); },
  follow(){ toast(D.chat.followToast); },
  cited(){ U.sheet = "cited"; renderLayer(); },
  why(el){ toggle(U.why, el.dataset.k); render(); },
  feedback(el){ addOnce(S.feedback, el.dataset.k); save(); render(); toast(D.feedback.toast); },
  take(el){
    if (S.ticketVerified){ grant(el.dataset.k); save(); render(); toast("领取成功，核销码在「我的权益」"); return; }
    U.sheet = "ticket"; U.ticketStep = "upload"; U.pending = el.dataset.k; renderLayer();
  },
  drop(){ toast("演示版请点「使用示例票根」"); },
  sample(){
    U.ticketStep = "reading"; renderLayer();
    setTimeout(() => { if (U.sheet === "ticket" && U.ticketStep === "reading"){ U.ticketStep = "matched"; renderLayer(); } }, 1000);
  },
  confirm(){ grant(U.pending); S.ticketVerified = true; U.sheet = null; save(); render(); toast("领取成功，核销码在「我的权益」"); },
  "to-benefits"(){ S.page = "benefits"; U.sheet = null; save(); render(); },
  back(){ S.page = S.page === "note" ? "benefits" : "answer"; save(); render(); },
  redeem(el){ const b = S.benefits.find(x => x.key === el.dataset.k); if (b) b.redeemed = true; save(); render(); toast("核销成功（演示）"); },
  "to-note"(){ S.page = "note"; U.noteT = U.noteB = null; save(); render(); },
  publish(){ S.page = "answer"; U.noteT = U.noteB = null; save(); render(); toast("已发布（演示）"); },
  "product-go"(){ toast(productCard().toast); },
  tab(el){ S.brandTab = Number(el.dataset.i); if (U.review >= D.claimReview.steps.length) U.review = -1; save(); render(); },
  "go-claim"(){ S.brandTab = 1; save(); render(); },
  "pain-row"(el){ toggle(U.painOpen, el.dataset.id); render(); },
  wait(el){ toggle(U.waitOpen, el.dataset.id); render(); },
  rule(el){ toggle(U.ruleOpen, el.dataset.id); render(); },
  submit(){
    const F = U.form, n = D.claimReview.steps.length;
    if (!F.solution.trim() || !F.offer.trim()){ toast("请填写解决方案和权益"); return; }
    U.review = 0; render();
    const tick = () => {
      U.review++;
      if (U.review >= n){
        S.newClaims = S.newClaims.filter(c => c.painId !== F.painId).concat([{painId:F.painId, brand:BA.name, category:BA.category, solution:F.solution.trim(), offer:F.offer.trim(), location:F.location.trim(), hours:F.hours.trim(), audience:F.audience, scope:F.scope}]);
        save();
      }
      if (S.view === "brand" && S.brandTab === 1) render();
      if (U.review < n) setTimeout(tick, 500);
    };
    setTimeout(tick, 500);
  },
  "go-user"(){ U.review = -1; toUser("scene1"); save(); render(); focusEl("#para-p7"); }
};

document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]"); if (!el) return;
  const a = el.dataset.action;
  /* closing a sheet never depends on the rest of the demo working */
  if (a === "close-sheet"){ U.sheet = null; renderLayer(); return; }
  const card = el.closest("[data-card]");
  if (card){ addOnce(S.seen, card.dataset.card); save(); }
  try { ACT[a] && ACT[a](el, e); } catch (err) { console.error(err); }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "ntT" || t.id === "ntB") return noteCheck();
  if (t.form && t.form.id === "cform" && t.name){
    U.form[t.name] = t.value;
    if (t.name === "scope") $("#cities").hidden = t.value === "仅本场";
    const pb = $("#prevBox"); if (pb) pb.innerHTML = previewHTML(previewCard());
  }
});
document.addEventListener("submit", e => e.preventDefault());
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (U.sheet){ U.sheet = null; renderLayer(); } else if (U.drawer){ U.drawer = false; renderDrawer(); }
});
mq.addEventListener ? mq.addEventListener("change", render) : mq.addListener(render);
render();
</script>
</body>
</html>
